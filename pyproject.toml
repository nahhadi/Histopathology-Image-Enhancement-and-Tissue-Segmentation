[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histoscope-classical-dip"
version = "1.0.0"
description = "Streamlit app for classical histopathology image processing and segmentation exploration"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
include = ["histopathology*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
